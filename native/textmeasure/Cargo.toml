[package]
name = "dolce-textmeasure"
version = "0.1.0"
edition = "2021"
description = "悦谱 Dolce：Node 侧排版量字（macOS CoreText / Windows DirectWrite / Linux 字体文件层）"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
# 系统文字引擎本体在工作区 crates/dolce-text 的 native 特性（Rust 排版也用它），这里只是 N-API 外壳
dolce-text = { path = "../../crates/dolce-text", features = ["native"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
