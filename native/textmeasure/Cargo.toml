[package]
name = "dolce-textmeasure"
version = "0.1.0"
edition = "2021"
description = "悦谱 Dolce：Node 侧排版量字（macOS CoreText / Windows DirectWrite）"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFAttributedString", "CFDictionary", "CFError", "CFNumber", "CFString", "CFCGTypes", "CFURL"] }
objc2-core-graphics = { version = "0.3", features = ["CGPath"] }
objc2-core-text = { version = "0.3", features = ["CTFont", "CTFontDescriptor", "CTFontManager", "CTFontTraits", "CTLine", "CTRun", "CTStringAttributes", "objc2-core-graphics"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_System_Com"] }
windows-core = "0.62"
windows-numerics = "0.3"
