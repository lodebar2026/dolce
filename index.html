            <button id="btn-recognize" data-context-control title="将识别结果与上传原图进行对照" data-i18n-title="toolbar.recognize.title" data-i18n="toolbar.recognize" hidden>原图对照</button>
            <button id="btn-src-side" data-context-control aria-pressed="false" title="排版稿左边铺整页原图：选中的音框出来，点原图上的音选中排版稿里那个" data-i18n-title="toolbar.srcSide.title" data-i18n="toolbar.srcSide" hidden>并排原图</button>
            <button id="btn-src-follow" data-context-control aria-pressed="false" title="在排版稿里选中音符时，右下角小窗显示原图上对应的那一行并框出这个音" data-i18n-title="toolbar.srcFollow.title" data-i18n="toolbar.srcFollow" hidden>原图片段</button>
            <label id="recog-view-field" class="status-select-field" data-context-control hidden>
              <span class="status-label" data-i18n="status.recogView">对照</span>
              <select id="sel-recog-view" title="原图对照方式" aria-label="原图对照方式" data-i18n-title="toolbar.recogView" data-i18n-aria="toolbar.recogView">
                <option value="floating" data-i18n="toolbar.recogView.floating">附近浮窗</option>
                <option value="inplace" data-i18n="toolbar.recogView.inplace">原位叠加</option>
                <option value="original" data-i18n="toolbar.recogView.original">仅原图</option>
              </select>
              <span class="select-chevron" aria-hidden="true">⌄</span>
            </label>
          </div>
          <span class="status-sep" aria-hidden="true"></span>
          <div class="tool-group">
            <span class="tool-label" data-i18n="toolbar.zoom">缩放</span>
            <button id="btn-zoom-out" class="icon-button" title="缩小 (Ctrl/⌘ -)" aria-label="缩小" data-i18n-title="toolbar.zoomOut.title" data-i18n-aria="toolbar.zoomOut">−</button>
            <button id="btn-zoom-reset" title="复位 (Ctrl/⌘ 0)" data-i18n-title="toolbar.zoomReset.title">100%</button>
            <button id="btn-zoom-in" class="icon-button" title="放大 (Ctrl/⌘ +)" aria-label="放大" data-i18n-title="toolbar.zoomIn.title" data-i18n-aria="toolbar.zoomIn">＋</button>
          </div>
          <div class="tool-group">
            <span class="tool-label" data-i18n="toolbar.page">页面</span>
            <button id="btn-prev" class="icon-button" title="上一页" aria-label="上一页" data-i18n-title="toolbar.prev" data-i18n-aria="toolbar.prev">‹</button>
            <button id="btn-next" class="icon-button" title="下一页" aria-label="下一页" data-i18n-title="toolbar.next" data-i18n-aria="toolbar.next">›</button>
          </div>
        </div>
      </footer>
    </div>
    <!-- hidden off-screen svg used for getBBox/getComputedTextLength measurement -->
    <svg id="measure-svg" width="0" height="0" aria-hidden="true"></svg>
  </body>
</html>
