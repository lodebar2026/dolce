[package]
name = "dolce"
version = "0.8.9"
description = "悦谱 Dolce：简谱与五线谱的编辑、识谱与排版"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dolce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 测速构建：前端启动时按 DOLCE_BENCH 自动识别、量 OCR 各段（src-tauri/src/lib.rs 的 bench 模块）；正式构建不带
bench = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dolce-engrave = { path = "../crates/engrave", features = ["native"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 排版与导出：会话（简谱 / 五线谱排版，排版线程在 src/layout.rs）、场景 → 矢量 PDF；原生量字在 dolce-engrave 的 native 特性
dolce-layout = { path = "../crates/layout", default-features = false, features = ["export-system"] }
dolce-model = { path = "../crates/model" }
dolce-layout-jianpu = { path = "../crates/layout-jianpu" }
bincode = "1.3"
# Rust 识别：识别、会话、取数、OCR 都在 crates/ 工作区；OCR 推理走原生 onnxruntime（native 特性；比浏览器 wasm 多线程快 ~3×），会话池在 src/omr.rs。
# 直接依赖 dolce-omr-core：它的构建脚本（pdf 特性）经 `links` 把 PDFium 动态库目录交给本包构建脚本（打包时拷进资源）
dolce-omr-core = { path = "../crates/omr-core", features = ["native", "pdf"] }
dolce-omr = { path = "../crates/omr", default-features = false, features = ["parallel", "native"] }

# macOS 原生 MIDI 播放：AVFoundation 的 AVMIDIPlayer（系统内置 DLS GM 音源），音色比前端采样器丰满。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-avf-audio = { version = "0.3", features = ["AVMIDIPlayer"] }
