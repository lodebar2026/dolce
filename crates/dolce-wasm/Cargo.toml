[package]
name = "dolce-wasm"
description = "悦谱 Dolce 模型 / 格式 / 排版的 wasm 绑定（wasm-bindgen）：网页版主线程用，Node 门面 out/cli/dolce.js 也载这一份"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-xml = { path = "../dolce-xml" }
dolce-session = { path = "../dolce-session" }
serde_json = "1"
wasm-bindgen = "=0.2.120"
console_error_panic_hook = "0.1"
