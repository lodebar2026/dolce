[package]
name = "dolce-wasm"
description = "悦谱 Dolce 模型 / 格式 / 排版的 wasm 绑定（wasm-bindgen）：网页版主线程用，Node 门面 out/cli/dolce.js 也载这一份"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# 对拍探针（dev rs-diff.mjs 用）：只编进 out/dolce-probe/ 那份，网页与桌面载的 public/redist/dolce/ 不带
probe = []

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-xml = { path = "../dolce-xml" }
dolce-session = { path = "../dolce-session" }
dolce-play = { path = "../dolce-play" }
dolce-model = { path = "../dolce-model" }
serde = { workspace = true }
# 分数、时刻过边界要逐位还原（TS 侧 JSON.stringify 出的是最短往返写法）
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.120"
js-sys = "0.3"
console_error_panic_hook = "0.1"
