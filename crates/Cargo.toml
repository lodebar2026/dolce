# Rust 工作区：识别（omr-*，职责见 docs/模块/识别-Rust.md）与模型 / 格式 / 排版（dolce-*，迁移中）。
[workspace]
resolver = "2"
members = ["cli", "dev", "engrave", "export-wasm", "jcx-wasm", "layout", "layout-jianpu", "layout-staff", "model", "omr", "omr-core", "omr-jianpu", "omr-staff", "omr-wasm", "wasm"]
# omr-wasm、dolce-wasm、dolce-jcx-wasm、dolce-export-wasm 只编 wasm32（scripts/build-wasm.mjs）；原生的 `cargo test` / `cargo build` 不带它
default-members = ["cli", "dev", "engrave", "layout", "layout-jianpu", "layout-staff", "model", "omr", "omr-core", "omr-jianpu", "omr-staff"]

[workspace.package]
version = "0.8.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/lodebar2026/dolce"
homepage = "https://lodebar2026.github.io/dolce/"
keywords = ["music", "notation", "jianpu", "sheet-music", "omr"]
categories = ["multimedia", "parser-implementations"]

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
sha2 = "0.10"
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
# 工作区内部可发布 crate（版本号与 [workspace.package].version 同步）
dolce-engrave = { version = "0.8.9", path = "engrave" }
dolce-layout = { version = "0.8.9", path = "layout", default-features = false }
dolce-layout-jianpu = { version = "0.8.9", path = "layout-jianpu" }
dolce-layout-staff = { version = "0.8.9", path = "layout-staff" }
dolce-model = { version = "0.8.9", path = "model" }
dolce-omr-core = { version = "0.8.9", path = "omr-core" }
dolce-omr = { version = "0.8.9", path = "omr", default-features = false }
dolce-omr-jianpu = { version = "0.8.9", path = "omr-jianpu" }
dolce-omr-staff = { version = "0.8.9", path = "omr-staff" }

[profile.release]
lto = "thin"

# 网页 / Node 门面载的 dolce-wasm、dolce-jcx-wasm（`scripts/build-wasm.mjs::buildDolce`）：fat LTO + 单代码单元，
# 比 release（thin）小一点、也略快（dolce_wasm gzip 880 → 855 KB）。2026-11-16 量过按体积编：opt-level=s 663 KB、z 582 KB，
# 但读写 MusicXML、时间轴、断句慢 15~20%（s）/ 30~60%（z），排版迁进来后开机计算都在这份里，不换。wasm-opt 在这之上反而让 gzip 变大，不用。
# 只给这两份用；识别那份和桌面原生仍走 release。
[profile.wasm-dolce]
inherits = "release"
lto = "fat"
codegen-units = 1
