# Rust 工作区：识别（omr-*，职责见 docs/模块/识别-Rust.md）与模型 / 格式 / 排版（dolce-*，迁移中）。
[workspace]
resolver = "2"
members = ["dolce-book", "dolce-cli", "dolce-dev", "engrave", "dolce-export", "dolce-export-wasm", "dolce-jcx-wasm", "dolce-layout-jianpu", "dolce-layout-staff", "model", "dolce-session", "dolce-wasm", "omr-book", "omr-core", "omr-engine", "omr-jianpu", "omr-ocr", "omr-sheet", "omr-source", "omr-staff", "omr-text", "omr-todoc", "omr-wasm"]
# omr-wasm、dolce-wasm、dolce-jcx-wasm、dolce-export-wasm 只编 wasm32（scripts/build-wasm.mjs）；原生的 `cargo test` / `cargo build` 不带它
default-members = ["dolce-book", "dolce-cli", "dolce-dev", "engrave", "dolce-export", "dolce-layout-jianpu", "dolce-layout-staff", "model", "dolce-session", "omr-book", "omr-core", "omr-engine", "omr-jianpu", "omr-ocr", "omr-sheet", "omr-source", "omr-staff", "omr-text", "omr-todoc"]

[workspace.package]
version = "0.8.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/lodebar2026/dolce"
homepage = "https://lodebar2026.github.io/dolce/"
keywords = ["music", "notation", "jianpu", "sheet-music", "omr"]
categories = ["multimedia", "parser-implementations"]

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
sha2 = "0.10"
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
# 工作区内部可发布 crate（版本号与 [workspace.package].version 同步）
dolce-book = { version = "0.8.9", path = "dolce-book" }
dolce-engrave = { version = "0.8.9", path = "engrave" }
dolce-export = { version = "0.8.9", path = "dolce-export", default-features = false }
dolce-layout-jianpu = { version = "0.8.9", path = "dolce-layout-jianpu" }
dolce-layout-staff = { version = "0.8.9", path = "dolce-layout-staff" }
dolce-model = { version = "0.8.9", path = "model" }
dolce-session = { version = "0.8.9", path = "dolce-session" }
dolce-omr-book = { version = "0.8.9", path = "omr-book" }
dolce-omr-core = { version = "0.8.9", path = "omr-core" }
dolce-omr-engine = { version = "0.8.9", path = "omr-engine", default-features = false }
dolce-omr-jianpu = { version = "0.8.9", path = "omr-jianpu" }
dolce-omr-ocr = { version = "0.8.9", path = "omr-ocr", default-features = false }
dolce-omr-sheet = { version = "0.8.9", path = "omr-sheet" }
dolce-omr-source = { version = "0.8.9", path = "omr-source" }
dolce-omr-staff = { version = "0.8.9", path = "omr-staff" }
dolce-omr-text = { version = "0.8.9", path = "omr-text" }
dolce-omr-todoc = { version = "0.8.9", path = "omr-todoc" }

[profile.release]
lto = "thin"

# 网页 / Node 门面载的 dolce-wasm、dolce-jcx-wasm（`scripts/build-wasm.mjs::buildDolce`）：fat LTO + 单代码单元，
# 比 release（thin）小一点、也略快（dolce_wasm gzip 880 → 855 KB）。2026-11-16 量过按体积编：opt-level=s 663 KB、z 582 KB，
# 但读写 MusicXML、时间轴、断句慢 15~20%（s）/ 30~60%（z），排版迁进来后开机计算都在这份里，不换。wasm-opt 在这之上反而让 gzip 变大，不用。
# 只给这两份用；识别那份和桌面原生仍走 release。
[profile.wasm-dolce]
inherits = "release"
lto = "fat"
codegen-units = 1
