# Rust 工作区：识别（omr-*，职责见 docs/模块/识别-Rust.md）与模型 / 格式 / 排版（dolce-*，迁移中）。
[workspace]
resolver = "2"
members = ["dolce-base", "dolce-cli", "dolce-engrave", "dolce-formats", "dolce-geom", "dolce-hanconv", "dolce-jcx-wasm", "dolce-layout-jianpu", "dolce-layout-staff", "dolce-model", "dolce-play", "dolce-scene", "dolce-session", "dolce-smufl", "dolce-style", "dolce-text", "dolce-text-native", "dolce-view", "dolce-wasm", "dolce-xml", "omr-book", "omr-build", "omr-cli", "omr-core", "omr-engine", "omr-jianpu", "omr-ocr", "omr-sheet", "omr-source", "omr-staff", "omr-text", "omr-todoc", "omr-wasm"]
# omr-wasm、dolce-wasm、dolce-jcx-wasm 只编 wasm32（scripts/build-wasm.mjs）；原生的 `cargo test` / `cargo build` 不带它
default-members = ["dolce-base", "dolce-cli", "dolce-engrave", "dolce-formats", "dolce-geom", "dolce-hanconv", "dolce-layout-jianpu", "dolce-layout-staff", "dolce-model", "dolce-play", "dolce-scene", "dolce-session", "dolce-smufl", "dolce-style", "dolce-text", "dolce-text-native", "dolce-view", "dolce-xml", "omr-book", "omr-build", "omr-cli", "omr-core", "omr-engine", "omr-jianpu", "omr-ocr", "omr-sheet", "omr-source", "omr-staff", "omr-text", "omr-todoc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
sha2 = "0.10"
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }

[profile.release]
lto = "thin"

# 网页 / Node 门面载的 dolce-wasm、dolce-jcx-wasm（`scripts/build-wasm.mjs::buildDolce`）：fat LTO + 单代码单元，
# 比 release（thin）小一点、也略快（dolce_wasm gzip 880 → 855 KB）。2026-11-16 量过按体积编：opt-level=s 663 KB、z 582 KB，
# 但读写 MusicXML、时间轴、断句慢 15~20%（s）/ 30~60%（z），排版迁进来后开机计算都在这份里，不换。wasm-opt 在这之上反而让 gzip 变大，不用。
# 只给这两份用；识别那份和桌面原生仍走 release。
[profile.wasm-dolce]
inherits = "release"
lto = "fat"
codegen-units = 1
