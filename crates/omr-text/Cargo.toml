[package]
name = "dolce-omr-text"
description = "悦谱 Dolce 识别两条路线共用的文字处理：和弦文法、页眉分类、歌词切字与对音、词间空格、速度 / 跳转 / 力度词表"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }
