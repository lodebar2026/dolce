[package]
name = "dolce-model"
description = "悦谱 Dolce 的语义模型 ScoreDoc（同 src/model/doc.ts）、查询层、MusicXML 读写与表层、投影、编辑动作"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-xml = { path = "../dolce-xml" }
serde.workspace = true
indexmap = { version = "2", features = ["serde"] }
ts-rs = { workspace = true, optional = true, features = ["indexmap-impl"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[features]
# 派生 TS 类型（`npm run gen:types`，生成 src/engine/gen/doc.gen.ts）
ts = ["dep:ts-rs", "dolce-base/ts"]
