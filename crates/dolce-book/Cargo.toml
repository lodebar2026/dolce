[package]
name = "dolce-book"
description = "悦谱 Dolce 的成书排版（照 src/pdflayout/）：DrawList、书级部件、页面树扁平化、成书重排、混排歌本"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
dolce-base = { workspace = true }
dolce-text = { workspace = true }
dolce-scene = { workspace = true }
dolce-model = { workspace = true }
dolce-view = { workspace = true }
dolce-play = { workspace = true }
dolce-style = { workspace = true }
dolce-engrave = { workspace = true }
dolce-layout-jianpu = { workspace = true }
dolce-layout-staff = { workspace = true }
serde.workspace = true
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }
