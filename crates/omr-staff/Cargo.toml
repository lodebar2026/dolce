[package]
name = "dolce-omr-staff"
description = "悦谱 Dolce 五线谱路线（含混排）：预处理、框架结构、结构信息、音符数据、文本及符号、线性符号、简谱互证"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# examples 是开发排查用的（读私有仓库语料、仓库里的模型目录），不进发布包
exclude = ["examples/"]

[dependencies]
dolce-omr-core = { workspace = true, features = ["pdf"] }
dolce-omr-jianpu = { workspace = true }
serde.workspace = true
serde_json = "1"

[dev-dependencies]
dolce-omr-core = { workspace = true, features = ["native"] }
flate2 = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
