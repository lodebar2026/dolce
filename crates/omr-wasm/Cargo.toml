[package]
name = "dolce-omr-wasm"
description = "悦谱 Dolce 识别的网页版绑定（wasm-bindgen）：文档、识别、五线谱会话与桌面版 Tauri 命令一一对应；OCR 用 tract 纯 Rust 推理，PDF 用 PDFium 的 wasm 版"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dolce-omr-core = { workspace = true, features = ["pdf", "tract"] }
dolce-omr-engine = { workspace = true }
serde_json = "1"
wasm-bindgen = "=0.2.120"
js-sys = "0.3"
# panic 时把信息打到控制台（不然只有 unreachable）
console_error_panic_hook = "0.1"
# tract 的随机数依赖在 wasm32-unknown-unknown 下要指定从 JS 取
getrandom = { version = "0.4", features = ["wasm_js"] }
