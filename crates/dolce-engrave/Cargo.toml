[package]
name = "dolce-engrave"
description = "悦谱 Dolce 的谱面元素（照 src/engrave/）：每种元素一份画法与定位判据，简谱引擎与五线谱 / 混排两条引擎共用。产出场景节点（dolce-scene）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-text = { path = "../dolce-text" }
dolce-scene = { path = "../dolce-scene" }
dolce-model = { path = "../dolce-model" }
dolce-play = { path = "../dolce-play" }
dolce-style = { path = "../dolce-style" }
serde.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
