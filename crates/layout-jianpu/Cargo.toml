[package]
name = "dolce-layout-jianpu"
description = "悦谱 Dolce 的简谱引擎（照 src/layout/jianpu/）：排版行视图 → 定位结构（place）→ 场景节点（compose）"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
dolce-engrave = { workspace = true }
dolce-model = { workspace = true }
serde.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# 只给单测对拍手写扫描（grid.rs / compose/brace.rs 原是正则）
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
