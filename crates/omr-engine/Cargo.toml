[package]
name = "dolce-omr-engine"
description = "悦谱 Dolce 识别的统一入口（桌面版 Tauri、网页版 wasm、命令行共用）：打开文档（PDF / 图片）、整页渲染、判路识别（带进度与取消）、五线谱会话、核对底图"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["parallel"]
# 页级并行（rayon）；wasm 下关掉，逐页串行
parallel = ["dep:rayon"]

[dependencies]
dolce-omr-core = { workspace = true }
dolce-omr-jianpu = { workspace = true }
dolce-omr-ocr = { workspace = true }
dolce-omr-sheet = { workspace = true }
dolce-omr-source = { workspace = true }
dolce-omr-staff = { workspace = true }
dolce-omr-todoc = { workspace = true }
serde = { workspace = true }
serde_json = "1"
rayon = { version = "1.10", optional = true }

[dev-dependencies]
dolce-omr-ocr = { workspace = true, features = ["native"] }
