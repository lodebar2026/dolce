[package]
name = "dolce-text"
description = "悦谱 Dolce 排版的量字层（照 src/common/measure.ts、cjkpunct.ts、cli/textmeasure.node.ts 的口径层）：量字 trait、按键缓存的 MeasureCtx、标点挤压、浏览器口径层 BrowserCompat、回放 ReplayMeasurer。无平台依赖，能编到 wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-geom = { path = "../dolce-geom" }
serde.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
# 编译期读仓库带的乐谱字体抽表（build.rs），运行时不带
ttf-parser = "0.25.1"
