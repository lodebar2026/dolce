[package]
name = "dolce-view"
description = "悦谱 Dolce 的排版行视图（同 src/jianpu/slots.ts::docView）、文本谱 AST 形状，以及由 ScoreDoc 拼演唱顺序 / 试听 / 断句的输入"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-model = { path = "../dolce-model" }
dolce-play = { path = "../dolce-play" }
serde.workspace = true

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
