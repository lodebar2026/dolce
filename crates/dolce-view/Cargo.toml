[package]
name = "dolce-view"
description = "悦谱 Dolce 的排版行视图（同 src/jianpu/slots.ts::docView）、文本谱 AST 形状，以及由 ScoreDoc 拼演唱顺序 / 试听 / 断句的输入"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
dolce-base = { workspace = true }
dolce-model = { workspace = true }
dolce-play = { workspace = true }
serde.workspace = true
encoding_rs = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }

[dev-dependencies]
# 循环 dev 依赖：保持无 version 的 path 写法，cargo publish 时自动剥离以打破 dolce-view <-> dolce-formats 循环
dolce-formats = { path = "../dolce-formats" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
