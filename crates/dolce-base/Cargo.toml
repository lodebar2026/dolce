[package]
name = "dolce-base"
description = "悦谱 Dolce 模型与排版的最底层：JS 数值口径、分数、UTF-16 位置表与原文区间、诊断消息、排版几何（点、矩形、3×3 矩阵、颜色、SVG 路径紧包围盒）。无平台依赖，能编到 wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# tagged.rs 慢路（标记不在第一个键时收进 Value 再读）
serde_json = "1"
ts-rs = { workspace = true, optional = true }

[features]
# 派生 TS 类型（`npm run gen:types` 开它跑 `cargo test`，生成 src/engine/gen/*.gen.ts）
ts = ["dep:ts-rs"]
