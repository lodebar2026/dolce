[package]
name = "dolce-base"
description = "悦谱 Dolce 模型与排版的最底层：JS 数值口径、分数、UTF-16 位置表与原文区间、诊断消息。无平台依赖，能编到 wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# 派生 TS 类型（`npm run gen:types` 开它跑 `cargo test`，生成 src/engine/gen/*.gen.ts）
ts = ["dep:ts-rs"]
