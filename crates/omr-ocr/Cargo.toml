[package]
name = "dolce-omr-ocr"
description = "悦谱 Dolce 识别的 OCR：PP-OCR 识别（rec）与检测（DBNet det）的前后处理、推理后端（原生 ort / 宿主注入）、按条内容寻址的结果缓存"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["native"]
# 原生推理（onnxruntime，桌面与命令行）；wasm 不开，推理由宿主页面经 `Infer` 注入
native = ["dep:ort"]

[dependencies]
dolce-omr-core = { path = "../omr-core" }
serde.workspace = true
serde_json = "1"
ort = { version = "=2.0.0-rc.14", optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
