[package]
name = "dolce-cli"
description = "悦谱 Dolce 的命令行：识谱、格式转换（含排版导出与 MIDI 导出）、歌本切分、回归"
version.workspace = true
edition.workspace = true
publish = true
license = "MIT AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "dolce"
path = "src/main.rs"

[dependencies]
dolce-omr-book = { workspace = true }
dolce-omr-core = { workspace = true }
dolce-omr-engine = { workspace = true, features = ["parallel"] }
dolce-omr-jianpu = { workspace = true }
dolce-omr-ocr = { workspace = true, features = ["native"] }
dolce-omr-sheet = { workspace = true }
dolce-omr-source = { workspace = true }
dolce-omr-staff = { workspace = true }
dolce-omr-todoc = { workspace = true }
dolce-export = { workspace = true, features = ["system", "book"] }
dolce-model = { workspace = true }
dolce-scene = { workspace = true }
dolce-style = { workspace = true }
dolce-session = { workspace = true }
dolce-engrave = { workspace = true }
dolce-text = { workspace = true, features = ["native"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json = "1"
rayon = "1.10"

[dev-dependencies]
dolce-omr-ocr = { workspace = true, features = ["tract"] }
