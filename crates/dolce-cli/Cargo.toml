[package]
name = "dolce-cli"
description = "悦谱 Dolce 模型 / 格式 / 排版的命令行（迁移期对拍、回归用；做完后回归脚本统一走它）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dolce"
path = "src/main.rs"

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-xml = { path = "../dolce-xml" }
dolce-scene = { path = "../dolce-scene" }
dolce-text = { path = "../dolce-text" }
dolce-text-native = { path = "../dolce-text-native" }
dolce-style = { path = "../dolce-style" }
dolce-model = { path = "../dolce-model" }
dolce-engrave = { path = "../dolce-engrave" }
dolce-geom = { path = "../dolce-geom" }
dolce-smufl = { path = "../dolce-smufl" }
dolce-layout-jianpu = { path = "../dolce-layout-jianpu" }
dolce-layout-staff = { path = "../dolce-layout-staff" }
dolce-book = { path = "../dolce-book" }
indexmap = "2"
serde.workspace = true
serde_json = "1"
sha2.workspace = true
