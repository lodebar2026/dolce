[package]
name = "dolce-cli"
description = "悦谱 Dolce 模型 / 格式 / 排版的命令行（迁移期对拍、回归用；做完后回归脚本统一走它）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dolce"
path = "src/main.rs"

[features]
# 旧编辑器 PDF 链（usvg + svg2pdf）只给 `scene-pdf --compare` 当参照；H 期删
oldpdf = ["dep:svg2pdf"]

[dependencies]
dolce-base = { path = "../dolce-base" }
dolce-scene = { path = "../dolce-scene" }
dolce-text = { path = "../dolce-text", features = ["native"] }
dolce-style = { path = "../dolce-style" }
dolce-model = { path = "../dolce-model" }
dolce-engrave = { path = "../dolce-engrave" }
dolce-layout-jianpu = { path = "../dolce-layout-jianpu" }
dolce-layout-staff = { path = "../dolce-layout-staff" }
dolce-book = { path = "../dolce-book" }
dolce-session = { path = "../dolce-session" }
bincode.workspace = true
indexmap = "2"
serde.workspace = true
serde_json = "1"
sha2.workspace = true
dolce-export = { path = "../dolce-export" }
dolce-omr-source = { path = "../omr-source" }
svg2pdf = { version = "0.13", optional = true }
