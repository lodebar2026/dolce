[package]
name = "dolce-cli"
description = "悦谱 Dolce 的命令行：识谱、格式转换（含排版导出与 MIDI 导出）、歌本切分、回归"
version.workspace = true
edition.workspace = true
publish = true
license = "MIT AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "multimedia"]
# examples 是开发排查用的（读私有仓库语料、仓库里的模型目录），不进发布包
exclude = ["examples/"]

[[bin]]
name = "dolce"
path = "src/main.rs"

[dependencies]
dolce-engrave = { workspace = true, features = ["native"] }
dolce-omr-core = { workspace = true, features = ["native", "pdf"] }
dolce-omr = { workspace = true, features = ["parallel", "native", "book"] }
dolce-omr-jianpu = { workspace = true }
dolce-omr-staff = { workspace = true }
dolce-layout = { workspace = true, features = ["export-system"] }
dolce-model = { workspace = true }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json = "1"
rayon = "1.10"

[dev-dependencies]
dolce-omr-core = { workspace = true, features = ["tract"] }
