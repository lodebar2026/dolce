[package]
name = "dolce-omr-jianpu"
description = "悦谱 Dolce 简谱路线：成像、数字行与小节线、调号拍号、数字与八度点 / 减时线 / 增时线 / 附点、歌词与页眉、弧，产出 RecognizedScore（JSON）"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# examples 是开发排查用的（读私有仓库语料、仓库里的模型目录），不进发布包
exclude = ["examples/"]

[dependencies]
dolce-omr-core = { workspace = true, features = ["pdf"] }
serde.workspace = true
serde_json = "1"
regex = { version = "1", features = ["std", "unicode-perl", "unicode-case", "perf"] }
