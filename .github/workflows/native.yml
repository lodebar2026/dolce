name: Native modules

# Node 侧的原生模块：排版量字（native/textmeasure：macOS CoreText / Windows DirectWrite）与位图识别像素内核（native/omrkernels）。
# 本机只有 macOS，Windows 那份靠这里编译并跑冒烟测试（各自的 smoke.mjs）。
# 只手动触发：Actions 页面选这个工作流点 Run workflow，或 gh workflow run native.yml。
on:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native/textmeasure
            native/omrkernels

      - name: Install dependencies
        run: npm ci

      - name: Build native module
        run: npm run build:native

      - name: Build CLI
        run: npm run build:cli

      - name: Smoke test (textmeasure)
        run: node native/textmeasure/smoke.mjs

      - name: Smoke test (omrkernels)
        run: node native/omrkernels/smoke.mjs
