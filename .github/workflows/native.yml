name: Native modules

# Node 侧的原生模块：排版量字（native/textmeasure：macOS CoreText / Windows DirectWrite）。（原位图识别像素内核 native/omrkernels 随 TS 识别删了，内核在 crates/omr-core::pixel。）
# 本机只有 macOS，Windows 那份靠这里编译并跑冒烟测试（各自的 smoke.mjs）。
# 只手动触发：Actions 页面选这个工作流点 Run workflow，或 gh workflow run native.yml。
on:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 冒烟里载 out/cli/engrave.js，它开头要载 dolce-wasm：wasm 目标 + 与 Cargo.lock 同版本的 wasm-bindgen
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            native/textmeasure
            crates

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$(grep -A1 '^name = "wasm-bindgen"$' crates/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" --locked

      - name: Install dependencies
        run: npm ci

      - name: Build native module
        run: npm run build:native

      - name: Build CLI
        run: npm run build:cli

      - name: Build dolce-wasm
        run: node scripts/build-wasm.mjs dolce

      - name: Smoke test (textmeasure)
        run: node native/textmeasure/smoke.mjs

