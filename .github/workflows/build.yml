name: Build

# 发布（release published）时编桌面版、识谱命令行分发包并传到同一个 release，网页版部署到 Pages。
# 手动触发（Actions 页面 Run workflow，或 gh workflow run build.yml --ref <分支>）时只编、不发：
# 桌面版与命令行包作为本次 run 的 artifact，网页版只构建不部署——发布前在分支上先验一遍整条链路。
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 编辑器开机要的 dolce-wasm（crates/dolce-wasm，vite build 开头由 scripts/build-wasm.mjs 编）：wasm 目标 + 与 Cargo.lock 同版本的 wasm-bindgen
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$(grep -A1 '^name = "wasm-bindgen"$' crates/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" --locked

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # 先单独编一遍 exe 校验：ort 静态链进来的 ONNX Runtime 是 /MD 编的，exe 直接导入
      # MSVCP140*/VCRUNTIME140*，这些 DLL 随包内置（src-tauri/tauri.windows.conf.json 的
      # resources）。清单漏了要在**上传之前**红，而不是等用户在干净的 Windows 上撞见
      # 「找不到 MSVCP140_1.dll」。下面 tauri 那步是增量编译，不会重来一遍。
      - name: 校验 Windows 包内置的 VC++ 运行库
        if: matrix.os == 'windows-latest'
        # bash（-e）：任一条失败即停；pwsh 不因原生命令非零退出而停，前面坏了会一路跑到最后才红、报错也指错地方
        shell: bash
        env:
          DOLCE_NO_WASM: "1"
        run: |
          npm run build
          node scripts/win-crt.mjs
          cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
          node scripts/win-crt.mjs --verify=src-tauri/target/${{ matrix.target }}/release/dolce.exe

      - name: Build and upload to release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.release.tag_name }}
          releaseName: ${{ github.event.release.name }}
          releaseBody: ${{ github.event.release.body }}
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build only (manual run)
        if: github.event_name != 'release'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload bundle (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 识谱命令行分发包（scripts/pack-omr.mjs）：Rust 识谱程序 omr-cli（识别、各格式写出、参照歌词都在里面）+ PDFium + OCR 模型，不带 Node。
  # 识谱程序与 PDFium 都是原生的、不能交叉打包，各平台在自己的 runner 上编。产物 omr-cli-<版本>-<os>-<cpu>。
  omr-cli:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pkg: darwin-arm64
          - os: windows-latest
            pkg: win32-x64
          # ort 预编译的静态 onnxruntime 用到 glibc 2.38 / GCC 13 的符号，22.04 链不过，至少 24.04；包的 glibc 下限随之是 2.39（下面 glibc floor 一步的读数）。
          # linux-arm64 暂不出；pack-omr.mjs 已支持，要时加 { os: ubuntu-24.04-arm, pkg: linux-arm64 }
          - os: ubuntu-24.04
            pkg: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # 只给打包脚本用（pack-omr.mjs 只依赖 Node 内置模块，不用 npm ci）
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Build omr-cli
        working-directory: crates
        run: cargo build --release -p dolce-omr-cli
      - name: Pack
        run: node scripts/pack-omr.mjs --targets=${{ matrix.pkg }}
      # 冒烟：解开的包在干净目录里能起来、载得到 OCR 模型与 ONNX Runtime，真识别一张图（截图里的简谱，只看能跑通），
      # 再从同一张图写一份 jcx（GBK 编码、Rust 写出端）
      - name: Smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir smoke && tar xzf out/pkg/*.tar.gz -C smoke
          smoke/*/omr-cli docs/screenshot-zh.png --kind=jianpu -f 123 -o smoke/out/a.123
          smoke/*/omr-cli docs/screenshot-zh.png --kind=jianpu -f jcx -o smoke/out/a.jcx
          ls -la smoke/out && test -s smoke/out/a.123 && test -s smoke/out/a.jcx
      # 只打印：包里二进制要求的最高 glibc 版本，即 Linux 包的运行下限
      - name: glibc floor (Linux)
        if: runner.os == 'Linux'
        run: objdump -T smoke/*/omr-cli smoke/*/libpdfium.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive (Get-Item out/pkg/*.zip).FullName -DestinationPath smoke
          $d = (Get-ChildItem smoke -Directory)[0].FullName
          New-Item -ItemType Directory smoke/out | Out-Null
          & "$d/omr-cli.exe" docs/screenshot-zh.png --kind=jianpu -f 123 -o smoke/out/a.123
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$d/omr-cli.exe" docs/screenshot-zh.png --kind=jianpu -f jcx -o smoke/out/a.jcx
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem smoke/out
          if ((Get-Item smoke/out/a.123).Length -eq 0 -or (Get-Item smoke/out/a.jcx).Length -eq 0) { exit 1 }
      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/pkg/omr-cli-* --clobber
      - name: Upload artifact (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: omr-cli-${{ matrix.pkg }}
          path: out/pkg/omr-cli-*
          if-no-files-found: error

  # Web 版随同一 release 部署到 GitHub Pages
  pages-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 网页版识别的 wasm（crates/omr-wasm）与编辑器开机要的 dolce-wasm（scripts/build-wasm.mjs 在 vite build 开头编）：wasm 目标 + 与 Cargo.lock 同版本的 wasm-bindgen
      - name: Setup Rust (wasm)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-all-crates: true
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$(grep -A1 '^name = "wasm-bindgen"$' crates/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" --locked
      - name: Type check
        run: npx tsc --noEmit
      - name: Build (subpath base for project Pages)
        run: npm run build
        env:
          BASE_PATH: /dolce/
      - name: 校验网页版 wasm 产物
        run: ls -la out/dist/redist/omr out/dist/redist/dolce && test -s out/dist/redist/omr/dolce_omr_wasm_bg.wasm && test -s out/dist/redist/omr/dolce_omr_wasm_relaxed_bg.wasm && test -s out/dist/redist/dolce/dolce_wasm_bg.wasm && test -s out/dist/redist/dolce/dolce_jcx_wasm_bg.wasm
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/dist

  pages-deploy:
    if: github.event_name == 'release'
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
